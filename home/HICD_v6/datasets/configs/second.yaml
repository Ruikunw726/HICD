# SECOND Dataset Configuration
dataset: second
description: Semantic Change Detection Dataset

# File naming convention (matches server data)
pre_suffix: _pre_war
post_suffix: _post_war
label_suffix: _target
image_ext: .tif
label_ext: .tif

# Label decode map: raw pixel value -> class index (0-based)
label_decode_map:
  0: 0
  11: 1
  15: 2
  19: 3
  23: 4
  27: 5

# Classes
num_targets: 6
num_states: 3
target_names:
  - Non-vegetation
  - Tree
  - Low vegetation
  - Water
  - Building
  - Playground
state_names:
  - no-change
  - increase
  - decrease

# Branch routing
branch_routing:
  instance:
    - Building
    - Playground
  semantic:
    - Non-vegetation
    - Tree
    - Low vegetation
    - Water

# Training config
train_split: train
val_split: val
test_split: test
